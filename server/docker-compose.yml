name: reverse-ssh-server

services:
  sshd:
    build: .
    image: reverse-ssh-server:local
    restart: unless-stopped
    ports:
      # SSH for tunnel clients (forward this port on the router)
      - "${SSH_PORT:-34051}:2222"
      # Tunnelled service: bound to the LAN address only, never forward it on the router
      - "${LAN_BIND:?set LAN_BIND in .env}:${LAN_PORT:-13000}:13000"
    environment:
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:?set AUTHORIZED_KEYS in .env}
    volumes:
      - hostkeys:/data
    tmpfs:
      - /run/tunnel:uid=10022,gid=10022,mode=0700
    read_only: true
    cap_drop: [ALL]
    # Only for the entrypoint: load the egress firewall, then switch to the
    # tunnel user. sshd itself runs with no capabilities at all.
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    # A connection is served by one single-threaded sshd process, so one CPU
    # never slows the tunnel down (it uses ~3% of a core at full speed); it
    # only caps whatever else might run here.
    cpus: 1.0
    healthcheck:
      # sshd listens on :2222 (0x08AE); a TCP probe would trip sshd PerSourcePenalties
      test: ["CMD", "grep", "-q", ":08AE 00000000:0000 0A", "/proc/net/tcp"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  hostkeys:
